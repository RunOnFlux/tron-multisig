name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  sdk:
    name: SDK — type-check, lint, format, test, build (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    defaults:
      run:
        working-directory: sdk
    steps:
      # Third-party actions are pinned to full commit SHAs (tags can be moved).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: yarn
          cache-dependency-path: sdk/yarn.lock
      - run: yarn install --frozen-lockfile
      - run: yarn audit --groups dependencies
      - run: yarn type-check
      - run: yarn lint
      - run: yarn format:check
      - run: yarn test
      - run: yarn build

  contracts:
    name: Contracts — compile with pinned tron-solc 0.8.31
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: yarn
      - run: yarn install --frozen-lockfile
      # compile.mjs verifies the compiler's sha256 before using it.
      - run: yarn compile
