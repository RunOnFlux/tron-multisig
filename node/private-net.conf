# WITNESS private key of the LOCAL private test chain only. It is deliberately public
# (throwaway, deterministic test key). Never use it on Nile or mainnet.
localwitness = [
  25b8a579e4b915b83ee02ca4ef279e82463761df5bb9a3c5e3759e765c75d14f
]

block = {
  needSyncCheck = false
  maintenanceTimeInterval = 120000   // 2 min: proposals + dynamic-energy cycles turn over fast
  proposalExpireTime = 60000         // 1 min
}

trx.reference.block = "head"

# IMPORTANT for private chains: the "energy limit" hard fork is gated on block height 4,727,890 (mainnet
# history). Without this, UpdateEnergyLimitContract is rejected and VMActuator uses the pre-fork
# (float-ratio) energy-limit path, i.e. NOT mainnet behaviour.
enery.limit.block.num = 0

vm = {
  supportConstant = true
  maxEnergyLimitForConstant = 100000000
  minTimeRatio = 0.0
  maxTimeRatio = 5.0
  saveInternalTx = true
  saveFeaturedInternalTx = true
  estimateEnergy = true
}

