# SSP TRON spike — single-SR private chain for java-tron GreatVoyage-v4.8.2.2 (FullNode-aarch64.jar, JDK17).
# Committee flags mirror TRON mainnet getchainparameters (fetched 2026-09-26) wherever config allows.
# Flags that are proposal-only (94/95/96, maxCpuTimeOfOneTx=80, maxFeeLimit) are applied by js/proposals.mjs.

net {
}

storage {
  db.engine = "ROCKSDB",
  db.sync = false,
  db.directory = "database",
  transHistory.switch = "on",
  properties = []
  needToUpdateAsset = true
  balance.history.lookup = false
  txCache.initOptimization = true
}

node.discovery = {
  enable = false
  persist = false
}

crypto {
  engine = "eckey"
}

node.metrics = {
  prometheus {
    enable = false
  }
}

node {
  trustNode = "127.0.0.1:50051"
  walletExtensionApi = true
  listen.port = 18888
  maxConnections = 30
  minConnections = 0
  minActiveConnections = 0
  maxConnectionsWithSameIp = 2
  maxHttpConnectNumber = 50
  minParticipationRate = 0
  isOpenFullTcpDisconnect = false
  inactiveThreshold = 600
  p2p {
    version = 733173
  }
  active = []
  passive = []
  fastForward = []
  http {
    fullNodeEnable = true
    fullNodePort = 8090
    solidityEnable = true
    solidityPort = 8091
    PBFTEnable = false
    PBFTPort = 8092
  }
  rpc {
    enable = true
    port = 50051
    solidityEnable = true
    solidityPort = 50061
    PBFTEnable = false
    PBFTPort = 50071
    minEffectiveConnection = 0   // single node: allow broadcast with zero peers
  }
  jsonrpc {
    httpFullNodeEnable = true
    httpFullNodePort = 8545
    httpSolidityEnable = false
    httpPBFTEnable = false
  }
  disabledApi = []
}

rate.limiter = {
  http = [],
  rpc = [],
  global.qps = 50000
  global.ip.qps = 10000
}

seed.node = {
  ip.list = []
}

